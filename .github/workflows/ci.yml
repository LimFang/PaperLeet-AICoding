name: AI Coding checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install local CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          npm --prefix web ci
      - name: Verify framework, frontend and algorithm exercises
        run: make ci PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: paperleet-ai-coding-web
          path: web/dist/

  aicb9-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install AICB-9 in a fresh virtual environment
        run: |
          python -m venv .venv-aicb9
          .venv-aicb9/bin/python -m pip install -e ".[aicb9]"
      - name: Verify lightweight profile and AICB-9 tests
        run: |
          .venv-aicb9/bin/python -c 'import importlib.util; assert importlib.util.find_spec("torch") is None; assert importlib.util.find_spec("numpy") is None'
          make check-aicb9 PYTHON=.venv-aicb9/bin/python
