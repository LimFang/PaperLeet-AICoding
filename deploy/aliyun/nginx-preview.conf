# Preview through SSH: ssh -N -L 8080:127.0.0.1:8080 paperleet-aliyun
# This virtual host is reachable only through the server's loopback interface.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;

    root /var/www/paperleet-coding/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Online judging is not available. Run PaperLeet locally."}';
    }

    location /assets/ {
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
