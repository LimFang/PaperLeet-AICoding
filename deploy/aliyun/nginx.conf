# Replace server_name with your registered domain before installation.
# HTTP bootstrap configuration; configure HTTPS after DNS is verified.
server {
    listen 80;
    listen [::]:80;
    server_name paperleet-coding.com;

    root /var/www/paperleet-coding/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # This deployment serves static content. The local Python judge stays local.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Online judging is not available. Run PaperLeet locally."}';
    }

    # Missing assets must produce a real 404, rather than SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
